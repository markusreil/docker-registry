name: docker-registry

x-hosts:
  registry: &host-registry registry.${BASE_DOMAIN:?BASE_DOMAIN is required}
  registry-ui: &host-registry-ui registry-ui.${BASE_DOMAIN:?BASE_DOMAIN is required}

services:
  registry:
    image: registry:${REGISTRY_VERSION:?REGISTRY_VERSION is required}
    expose:
      - "5000"
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_DELETE_ENABLED: ${REGISTRY_STORAGE_DELETE_ENABLED:-false}
      VIRTUAL_HOST: *host-registry
      VIRTUAL_PORT: "5000"
      ACME_HOST: *host-registry
      GEN_SELF_SIGNED_CERT: ${REGISTRY_GEN_SELF_SIGNED_CERT:-true}
      NGINX_MAX_BODY_SIZE: ${REGISTRY_NGINX_MAX_BODY_SIZE:-0}
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - web-proxy
    restart: unless-stopped

  registry-ui:
    image: joxit/docker-registry-ui:${REGISTRY_UI_VERSION:?REGISTRY_UI_VERSION is required}
    expose:
      - "80"
    environment:
      REGISTRY_TITLE: ${REGISTRY_UI_TITLE:-Docker Registry UI}
      SINGLE_REGISTRY: "true"
      # Server-side proxy to the registry over the compose network (internal
      # service name, plain HTTP). The browser never contacts the registry
      # directly, so no public hostname and no CORS setup are needed here.
      NGINX_PROXY_PASS_URL: http://registry:5000
      # Docker embedded DNS so nginx re-resolves the registry if it is recreated.
      NGINX_RESOLVER: 127.0.0.11
      # Display-only host shown in `docker pull` commands.
      PULL_URL: https://registry.${BASE_DOMAIN:?BASE_DOMAIN is required}
      DELETE_IMAGES: ${REGISTRY_UI_DELETE_IMAGES:-false}
      SHOW_CONTENT_DIGEST: ${REGISTRY_UI_SHOW_DIGEST:-true}
      VIRTUAL_HOST: *host-registry-ui
      VIRTUAL_PORT: "80"
      ACME_HOST: *host-registry-ui
      GEN_SELF_SIGNED_CERT: ${REGISTRY_UI_GEN_SELF_SIGNED_CERT:-true}
    networks:
      - web-proxy
    restart: unless-stopped
    labels:
      homepage.group: Infrastructure
      homepage.name: Registry UI
      homepage.icon: docker
      homepage.href: https://registry-ui.${BASE_DOMAIN:?BASE_DOMAIN is required}
      homepage.description: Web UI for browsing the Docker registry.

networks:
  web-proxy:
    name: ${NGINX_PROXY_NETWORK:-web-proxy}
    external: true

volumes:
  registry-data:
